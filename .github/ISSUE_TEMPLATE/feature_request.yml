name: Feature request
description: Suggest an improvement to sysreqR.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior you would like.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Mention any workaround or alternative design.
    validations:
      required: false
  - type: dropdown
    id: audience
    attributes:
      label: Primary audience
      options:
        - New R or GNU/Linux users
        - Package developers
        - System administrators
        - CI or deployment users
        - Other
    validations:
      required: true
